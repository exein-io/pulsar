name: Quality Checks
on:
  pull_request:
    branches:
      - "*"

jobs:
  lychee-link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu

    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.platform.target }}

      - name: Formatting (rustfmt)
        run: cargo fmt -- --check

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            args: "--features full"

          # For `musl` builds, use the `all-vendored` and `tls-rustls` features.
          - target: x86_64-unknown-linux-musl
            args: "--no-default-features --features full --features all-vendored --features tls-rustls"

          - target: aarch64-unknown-linux-gnu
            args: "--features full"

          # For `musl` builds, use the `all-vendored` and `tls-rustls` features.
          - target: aarch64-unknown-linux-musl
            args: "--no-default-features --features full --features all-vendored --features tls-rustls"

          - target: riscv64gc-unknown-linux-gnu
            args: "--features full"

          # For `musl` builds, use the `all-vendored` and `tls-rustls` features.
          - target: riscv64gc-unknown-linux-musl
            args: "--no-default-features --features full --features all-vendored --features tls-rustls"

    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install cross
        uses: ./.github/actions/install-cross

      - name: Clippy (all crates)
        run: cross clippy --locked --target=${{ matrix.platform.target }} --workspace --all-targets ${{ matrix.platform.args }} -- -D warnings

      - name: Check build did not modify any files
        run: test -z "$(git status --porcelain)"
