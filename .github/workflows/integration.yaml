name: Integration tests
on:
  pull_request:
    branches:
      - "*"

jobs:
  architest:
    name: architest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # Kernel versions come from the justfile so they stay in one place.
      - name: Integration tests
        run: nix develop --command just architest ${{ matrix.arch }}

  lvh:
    name: lvh (${{ matrix.arch }}, ${{ matrix.kernel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        kernel:
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # amd64 boots with hardware acceleration; arm64 is emulated and needs none.
      - name: Allow access to /dev/kvm
        if: matrix.arch == 'amd64'
        run: sudo chmod 666 /dev/kvm

      - name: Run test suite
        run: nix develop --command just lvh ${{ matrix.arch }} ${{ matrix.kernel }}
