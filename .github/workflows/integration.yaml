name: Integration tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  architest:
    name: architest (${{ matrix.profile }}, ${{ matrix.arch }}, ${{ matrix.kernel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          # - debug
          - release

        arch:
          - amd64
          - arm64

        kernel:
          - "5.13"
          - "5.15"
          - "6.0"
          - "6.2"
          - "6.3"
          - "6.6"

        # Kernels without an architest image for that arch.
        exclude:
          - arch: amd64
            kernel: "6.2"
          - arch: arm64
            kernel: "5.13"
          - arch: arm64
            kernel: "6.0"
          - arch: arm64
            kernel: "6.3"

        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl

    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        if: endsWith(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}-${{ matrix.profile }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross
        uses: ./.github/actions/install-cross

      - name: Integration tests
        if: endsWith(matrix.target, 'musl')
        run: |
          cargo xtask test-suite \
              --force-architest \
              --target=${{ matrix.target }} \
              --kernel-versions=${{ matrix.kernel }} \
              --features all-vendored --features tls-rustls

  lvh:
    name: lvh (${{ matrix.profile.name }}, ${{ matrix.platform.arch }}, ${{ matrix.kernel.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          #   - name: debug
          #     cargo-profile: dev
          #     out-dir: debug
          - name: release
            cargo-profile: release
            out-dir: release

        kernel:
          - version: "6.12"
            build:
              date: "20250630.013259"
          - version: "6.6"
            build:
              date: "20250630.013259"
          - version: "6.1"
            build:
              date: "20250630.013259"
          - version: "5.15"
            build:
              date: "20250630.013259"

        platform:
          - target: x86_64-unknown-linux-musl
            arch: "amd64"
            cpu-kind: host

          - target: aarch64-unknown-linux-musl
            arch: "arm64"
            cpu-kind: cortex-a57

    steps:
      - name: Code checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.platform.target }}-${{ matrix.profile.name }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross
        uses: ./.github/actions/install-cross

      - name: Build test suite
        run: |
          cross build \
            --target=${{ matrix.platform.target }} \
            --profile ${{ matrix.profile['cargo-profile'] }} \
            --workspace \
            --bin test-suite \
            --features all-vendored --features tls-rustls

      - name: Run test suite
        id: lvh
        uses: cilium/little-vm-helper@9c1f3a549af06e213863d034c13ba1c5d1e3c667 # v0.0.26
        with:
          test-name: test-suite-run
          image: "kind"
          image-version: ${{ matrix.kernel.version }}-${{ matrix.kernel.build.date }}
          kernel-version: ${{ matrix.kernel.version }}-${{ matrix.kernel.build.date }}
          host-mount: .
          # qemu-system is installed above; the action's own provisioning
          # path fails on the ubuntu-24.04 runners.
          install-dependencies: "false"
          arch: ${{ matrix.platform.arch }}
          cpu-kind: ${{ matrix.platform['cpu-kind'] }}
          ssh-connect-wait-retries: "10"
          verbose: true
          cmd: |
            # print kernel version
            echo "Kernel Version: "
            uname -a

            # run test suite
            sudo /host/target/${{ matrix.platform.target }}/${{ matrix.profile['out-dir'] }}/test-suite

      # The action caches the VM image and kernel unconditionally, about 9 GB
      # per run, which evicts our other caches. Deleting them here leaves its
      # post-job save step nothing to upload. This relies on the action's
      # internal layout: `rm` fails if these paths move, but when bumping its
      # version also check that it does not cache anything else. Replace with
      # `cache-artifacts: false` once https://github.com/cilium/little-vm-helper/pull/734
      # is released.
      - name: Remove lvh image and kernel before caching
        if: ${{ always() && steps.lvh.outcome != 'skipped' }}
        run: |
          sudo rm /images/${{ matrix.platform.arch }}/images/kind_${{ matrix.kernel.version }}.qcow2.zst
          sudo rm -r /kernels/${{ matrix.platform.arch }}/${{ matrix.kernel.version }}-${{ matrix.kernel.build.date }}
