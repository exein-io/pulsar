[package]
name = "pulsar"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Crates
bpf-common = { workspace = true }
engine-api = { workspace = true }
pulsar-core = { workspace = true }
# Modules
desktop-notifier = { workspace = true, optional = true }
file-system-monitor = { workspace = true, optional = true }
threat-logger = { workspace = true, optional = true }
network-monitor = { workspace = true, optional = true }
process-monitor = { workspace = true, optional = true }
rules-engine = { workspace = true, optional = true }
smtp-notifier = { workspace = true, optional = true }
# External
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
comfy-table = { workspace = true }
env_logger = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap-verbosity-flag = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
vergen-gitcl = { workspace = true }

[features]
default = ["full", "tls-openssl"]
full = ["core", "extra"]
core = [
    "threat-logger",
    "process-monitor",
    "network-monitor",
    "file-system-monitor",
]
extra = ["rules-engine", "desktop-notifier", "smtp-notifier"]
tls-openssl = ["smtp-notifier/tls-openssl"]
tls-rustls = ["smtp-notifier/tls-rustls"]
all-vendored = ["openssl-vendored", "sqlite3-vendored"]
openssl-vendored = ["smtp-notifier?/openssl-vendored"]
sqlite3-vendored = ["bpf-common/sqlite3-vendored"]

[workspace]
members = [
    "crates/modules/file-system-monitor",
    "crates/modules/process-monitor",
    "crates/modules/network-monitor",
    "crates/modules/rules-engine",
    "crates/modules/threat-logger",
    "crates/modules/desktop-notifier",
    "crates/modules/smtp-notifier",
    "crates/pulsar-core",
    "crates/bpf-common",
    "crates/bpf-builder",
    "crates/engine-api",
    "crates/validatron",
    "crates/bpf-filtering",
    "crates/bpf-features",
    "crates/bpf-feature-autodetect",
    "crates/bpf-features-macros",
    "xtask",
    "test-suite",
]

[workspace.package]
version = "0.11.0-alpha.1"
license = "Apache-2.0 WITH BPF probes exception under GPL-2.0"
edition = "2024"
repository = "https://github.com/exein-io/pulsar"

[workspace.dependencies]
# Crates
bpf-builder = { path = "crates/bpf-builder" }
bpf-common = { path = "crates/bpf-common" }
bpf-features = { path = "crates/bpf-features" }
bpf-feature-autodetect = { path = "crates/bpf-feature-autodetect" }
bpf-features-macros = { path = "crates/bpf-features-macros" }
bpf-filtering = { path = "crates/bpf-filtering" }
engine-api = { path = "crates/engine-api" }
pulsar-core = { path = "crates/pulsar-core" }
validatron = { path = "crates/validatron" }
validatron-derive = { path = "crates/validatron/derive" }
# Modules
desktop-notifier = { path = "crates/modules/desktop-notifier" }
file-system-monitor = { path = "crates/modules/file-system-monitor" }
threat-logger = { path = "crates/modules/threat-logger" }
network-monitor = { path = "crates/modules/network-monitor" }
process-monitor = { path = "crates/modules/process-monitor" }
rules-engine = { path = "crates/modules/rules-engine" }
smtp-notifier = { path = "crates/modules/smtp-notifier" }
# External
anyhow = "1.0.104"
aya = { version = "0.13.1", features = ["async_tokio"] }
aya-ebpf-bindings = "0.2.0"
aya-obj = "0.2.1"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45" }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.0"
dns-mock-server = "0.2.0"
dns-parser = "0.8.0"
diesel = { version = "2.3.13", features = ["sqlite"] }
env_logger = "0.11.11"
flate2 = "1.1.10"
futures-util = "0.3.34"
gethostname = "1.1.0"
glob = "0.3.4"
hickory-resolver = "0.26.3"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.20"
hyperlocal = "0.9.1"
indicatif = "0.18.6"
lalrpop = "0.23.1"
lalrpop-util = { version = "0.23.1", features = ["lexer"] }
leon = "3.0.3"
lettre = { version = "0.11.23", default-features = false, features = [
    "smtp-transport",
    "tokio1-native-tls",
    "tokio1",
    "builder",
] }
libc = "0.2.189"
libtest-mimic = "0.8.2"
libsqlite3-sys = { version = "0.38.2" }
log = { version = "0.4.34", features = ["std"] }
nix = { version = "0.31.3", features = [
    "fs",
    "process",
    "time",
    "user",
    "signal",
    "net",
] }
num_cpus = "1.17.0"
nut = "0.1.4"
openssl = "0.10.81"
proc-macro2 = "1.0.107"
procfs = { version = "0.18.0", default-features = false }
quote = "1.0.47"
rand = { version = "0.10.2" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
signal-hook = "0.4.4"
strum = { version = "0.28.0", features = ["derive"] }
syn = "2.0.119"
sys-mount = { version = "3.1.0", default-features = false }
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-fd = "0.3.0"
tokio-tungstenite = "0.29.0"
uuid = { version = "1.26.1", features = ["v4"] }
which = "8.0.6"
xshell = "0.2.7"
vergen-gitcl = "10.0.3"
clap-verbosity-flag = "3.0.4"
toml = "1.1.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
